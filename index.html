<!DOCTYPE html>
<!-- DIAGNOSTIC: DEPLOYED 2026-03-19 17:15 UTC -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLOP LOCKS — Sports Predictions</title>
  <meta name="description" content="Big Slime's minimalist sports predictions. NBA & NCAAM daily picks.">
  <meta name="theme-color" content="#39FF14">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --slime: #39FF14;
      --dim: #888888;
      --hacker: #1A1A1A;
      --black: #000000;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--black);
      color: var(--slime);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 450px;
      border-left: 1px solid var(--hacker);
      border-right: 1px solid var(--hacker);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--black);
    }

    /* Utility Classes */
    .border-b { border-bottom: 1px solid var(--hacker); }
    .border-t { border-top: 1px solid var(--hacker); }
    .dashed-b { border-bottom: 1px dashed var(--hacker); }
    .dim { color: var(--dim); }
    .p-1 { padding: 4px; }
    .p-2 { padding: 8px; }
    .p-3 { padding: 12px; }
    .flex { display: flex; }
    .justify-between { justify-content: space-between; }
    .items-center { align-items: center; }
    .text-center { text-align: center; }
    .uppercase { text-transform: uppercase; }

    /* Ticker */
    #ticker-top {
      width: 100%;
      height: 28px;
      background: var(--hacker);
      color: var(--slime);
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    /* Navigation */
    #sport-nav {
      display: flex;
      border-bottom: 1px solid var(--hacker);
      width: 100%;
    }
    .sport-pill {
      background: none;
      border: none;
      color: var(--dim);
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 16px 8px;
      cursor: pointer;
      flex: 1;
      text-transform: uppercase;
      transition: all 0.2s;
      outline: none;
    }
    .sport-pill.active {
      color: var(--slime);
    }

    /* Tape Feed */
    #tape-feed {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Logs Footer */
    #logs-footer {
      border-top: 1px solid var(--hacker);
      margin-top: auto;
    }
    .info-toggle {
      width: 100%;
      padding: 12px;
      background: var(--hacker);
      border: none;
      color: var(--dim);
      font-family: var(--font-mono);
      font-size: 11px;
      text-align: left;
      cursor: pointer;
      text-transform: uppercase;
    }
    .info-content {
      display: none;
      padding: 12px;
      background: var(--black);
    }
    .expanded .info-content {
      display: block;
    }

    /* Animations */
    .pulse { animation: pulseAnim 2s infinite; }
    @keyframes pulseAnim { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>
<body>
  <div id="ticker-top">
    [ TOP EDGE: --% ] [ TOTAL GAMES: -- ] [ BOT: OPTIMAL ]
  </div>

  <div class="container">
    <nav id="sport-nav">
      <button class="sport-pill active" data-sport="nba">[ NBA ]</button>
      <button class="sport-pill" data-sport="ncaam">( NCAAM )</button>
    </nav>

    <main id="tape-feed">
      <div id="loading-state" class="p-3 text-center dim pulse">
        LOADING LIVE MODELS...
      </div>

      <div id="locks-section" style="display:none;">
        <div id="locks-container"></div>
      </div>

      <div id="slimegrinder-section" style="display:none;">
        <div id="slimegrinder-container"></div>
      </div>

      <button id="reveal-btn" style="display:none;" class="info-toggle text-center">
        [ + ] VIEW FULL SLATE
      </button>

      <div id="slate-section" style="display:none;">
        <div id="slate-container"></div>
      </div>
    </main>

    <footer id="logs-footer" class="info-section">
      <button class="info-toggle">
        <span>[ + ] SYSTEM LOGS / PERFORMANCE</span>
        <span class="arrow">▼</span>
      </button>
      <div class="info-content">
        <div id="pick-stats"></div>
        <div id="season-stats"></div>
        <div id="last-updated" class="dim" style="font-size: 10px; margin-top: 8px;"></div>
        <div id="data-sources" class="dim" style="font-size: 10px; margin-top: 4px;"></div>
        <div class="dim" style="font-size: 9px; margin-top: 12px; opacity: 0.5;">FOR ENTERTAINMENT PURPOSES ONLY</div>
        <div style="margin-top: 12px;">
          <a href="https://ko-fi.com/sloplocks" target="_blank" rel="noopener" style="color:var(--slime); text-decoration: none; font-size: 10px;">[ BUY US A COFFEE ]</a>
        </div>
      </div>
    </footer>
  </div>

  <script>
    (function() {
      'use strict';

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(function(){});
      }

      var predictionData = null;
      var currentSport = 'nba';
      var slateVisible = false;

      var tickerTop = document.getElementById('ticker-top');
      var loadingState = document.getElementById('loading-state');
      var slimegrinderSection = document.getElementById('slimegrinder-section');
      var slimegrinderContainer = document.getElementById('slimegrinder-container');
      var locksSection = document.getElementById('locks-section');
      var locksContainer = document.getElementById('locks-container');
      var slateSection = document.getElementById('slate-section');
      var slateContainer = document.getElementById('slate-container');
      var revealBtn = document.getElementById('reveal-btn');
      var lastUpdated = document.getElementById('last-updated');
      var infoSection = document.getElementById('logs-footer');
      var pickStatsDiv = document.getElementById('pick-stats');
      var seasonStatsDiv = document.getElementById('season-stats');
      var dataSourcesDiv = document.getElementById('data-sources');

      function createEl(tag, className, textContent) {
        var el = document.createElement(tag);
        if (className) el.className = className;
        if (textContent !== undefined) el.textContent = textContent;
        return el;
      }

      function formatOdds(american) {
        if (american == null) return '--';
        return american >= 0 ? '+' + american : american;
      }

      function formatPct(p) { return (p * 100).toFixed(1) + '%'; }

      function formatTimestamp(isoStr) {
        var d = new Date(isoStr);
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + ' ET';
      }

      function createMatchCard(match, type) {
        var cardClass = 'card';
        if (type === 'lock') cardClass += ' lock';
        if (type === 'slimegrinder') cardClass += ' slimegrinder';
        if (match.completed) cardClass += ' completed';
        
        var card = createEl('div', cardClass);
        var probs = match.model_probs || { home: 0.33, draw: 0.34, away: 0.33 };
        var edges = match.edges || {};
        
        var teams = createEl('div', 'match-teams');
        
        function createStats(side) {
          var p = probs[side] || 0;
          var e = (edges[side] && edges[side].edge) ? edges[side].edge : 0;
          var div = createEl('div', 'team-stats');
          div.appendChild(createEl('span', 'prob', (p * 100).toFixed(1) + '%'));
          var edgeSpan = createEl('span', 'edge ' + (e > 0 ? 'pos' : 'neg'), '(' + (e > 0 ? '+' : '') + (e * 100).toFixed(1) + '%)');
          div.appendChild(edgeSpan);
          return div;
        }

        var hRow = createEl('div', 'team-row');
        hRow.appendChild(createEl('span', 'team-name', match.home_team));
        hRow.appendChild(createStats('home'));
        hRow.appendChild(createEl('span', 'pick-badge' + (match.pick === 'home' ? ' active' : ''), 'WIN'));
        
        var aRow = createEl('div', 'team-row');
        aRow.appendChild(createEl('span', 'team-name', match.away_team));
        aRow.appendChild(createStats('away'));
        aRow.appendChild(createEl('span', 'pick-badge' + (match.pick === 'away' ? ' active' : ''), 'WIN'));
        
        teams.appendChild(hRow);
        teams.appendChild(aRow);
        card.appendChild(teams);

        var footer = createEl('div', 'card-footer');
        var pick = match.pick || 'home';
        var oddsVal = match.american_odds || (match.edges && match.edges[pick] ? match.edges[pick].american_odds : null);
        var edgeVal = match.edge || (match.edges && match.edges[pick] ? match.edges[pick].edge : 0);
        
        var info = createEl('div', 'odds-edge');
        info.innerHTML = '<strong>' + formatOdds(oddsVal) + '</strong>';
        if (edgeVal > 0) {
          var edgeSpan = createEl('span', 'edge', '+' + (edgeVal * 100).toFixed(1) + '% EDGE');
          info.appendChild(edgeSpan);
        }
        footer.appendChild(info);

        var stars = createEl('div', 'stars', '★★★★★'.substring(0, match.confidence_stars || 1));
        footer.appendChild(stars);
        card.appendChild(footer);

        if (match.completed || match.date) {
          var meta = createEl('div', 'match-meta', (match.completed ? 'FINAL' : 'UPCOMING'));
          if (match.neutral) {
            meta.appendChild(createEl('span', 'neutral-badge', 'NEUTRAL SITE'));
          }
          card.appendChild(meta);
        }

        return card;
      }

      function render(data) {
        locksContainer.textContent = '';
        slimegrinderContainer.textContent = '';
        slateContainer.textContent = '';
        
        var locks = data.slop_locks || [];
        var grinders = data.slimegrinder || [];
        var allMatches = data.matches || [];
        
        // Update ticker: find max edge
        var maxEdge = 0;
        allMatches.forEach(function(m) {
          var e = (m.edge) ? m.edge : 0;
          if (e > maxEdge) maxEdge = e;
        });
        tickerTop.textContent = '[ TOP EDGE: +' + (maxEdge * 100).toFixed(1) + '% ] [ TOTAL GAMES: ' + allMatches.length + ' ] [ BOT: OPTIMAL ]';

        // Sort matches by Edge descending for the slate
        allMatches.sort(function(a, b) {
          var ae = a.edge || 0;
          var be = b.edge || 0;
          return be - ae;
        });

        // Filter out locks and grinders from the allMatches list to avoid duplicates
        var usedKeys = {};
        locks.forEach(function(l) { usedKeys[l.home_team + l.away_team] = true; });
        grinders.forEach(function(g) { usedKeys[g.home_team + g.away_team] = true; });
        
        var slateMatches = allMatches.filter(function(m) { return !usedKeys[m.home_team + m.away_team]; });

        // FALLBACK: If no grinders found (e.g. no odds), show top 3 likeliest winners as "projected"
        if (grinders.length === 0 && allMatches.length > 0) {
          grinders = allMatches.slice(0, 3);
          slimegrinderSection.querySelector('.section-label').textContent = 'PROJECTED TRIO (NO ODDS)';
        } else {
          slimegrinderSection.querySelector('.section-label').textContent = 'SLIMEGRINDER TRIO';
        }

        if (grinders.length > 0) {
          grinders.forEach(function(g) { slimegrinderContainer.appendChild(createMatchCard(g, 'slimegrinder')); });
          slimegrinderSection.style.display = 'block';
        } else {
          slimegrinderSection.style.display = 'none';
        }

        if (locks.length > 0) {
          locks.forEach(function(l) { locksContainer.appendChild(createMatchCard(l, 'lock')); });
          locksSection.style.display = 'block';
        } else {
          locksSection.style.display = 'none';
        }

        if (slateMatches.length > 0) {
          slateMatches.forEach(function(m) { slateContainer.appendChild(createMatchCard(m, false)); });
          revealBtn.style.display = 'block';
        } else {
          revealBtn.style.display = 'none';
        }

        if (data.generated_at) {
          lastUpdated.textContent = 'UPDATED ' + formatTimestamp(data.generated_at).toUpperCase();
        }

        renderStats(data);
      }

      function renderStats(data) {
        pickStatsDiv.textContent = '';
        seasonStatsDiv.textContent = '';
        
        var ps = data.pick_stats || {};
        var ss = data.season_stats || {};

        function addStat(parent, label, value, isSlime) {
          var row = createEl('div', 'stat-row');
          row.appendChild(createEl('span', 'stat-label', label));
          row.appendChild(createEl('span', 'stat-value' + (isSlime ? ' slime' : ''), value));
          parent.appendChild(row);
        }

        if (ps.all) {
          addStat(pickStatsDiv, 'Record', ps.all.wins + '-' + ps.all.losses);
          addStat(pickStatsDiv, 'ROI', (ps.all.roi * 100).toFixed(1) + '%', ps.all.roi > 0);
          addStat(pickStatsDiv, 'Win Rate', (ps.all.hit_rate * 100).toFixed(1) + '%');
        }

        addStat(seasonStatsDiv, 'Total Games', String(ss.total_matches || 0));
        addStat(seasonStatsDiv, 'Home Win %', (ss.home_win_pct * 100).toFixed(1) + '%');
        addStat(seasonStatsDiv, 'Away Win %', (ss.away_win_pct * 100).toFixed(1) + '%');
      }

      function loadSportData(sport) {
        currentSport = sport;
        loadingState.style.display = 'block';
        slimegrinderSection.style.display = 'none';
        locksSection.style.display = 'none';
        slateSection.style.display = 'none';
        revealBtn.style.display = 'none';
        
        fetch('data/' + sport + '/predictions.json?t=' + Date.now())
          .then(function(res) { return res.json(); })
          .then(function(data) {
            predictionData = data;
            loadingState.style.display = 'none';
            render(data);
          })
          .catch(function(err) {
            loadingState.textContent = 'ERROR LOADING DATA';
            console.error(err);
          });
      }

      document.querySelectorAll('.sport-pill').forEach(function(pill) {
        pill.addEventListener('click', function() {
          var s = this.getAttribute('data-sport');
          if (s === currentSport) return;
          
          document.querySelectorAll('.sport-pill').forEach(function(p) {
            p.classList.remove('active');
            var sport = p.getAttribute('data-sport').toUpperCase();
            p.textContent = '( ' + sport + ' )';
          });
          
          this.classList.add('active');
          var activeSport = this.getAttribute('data-sport').toUpperCase();
          this.textContent = '[ ' + activeSport + ' ]';
          
          slateVisible = false;
          slateSection.style.display = 'none';
          loadSportData(s);
        });
      });

      revealBtn.addEventListener('click', function() {
        slateVisible = !slateVisible;
        slateSection.style.display = slateVisible ? 'block' : 'none';
        this.textContent = slateVisible ? '[ - ] HIDE SLATE' : '[ + ] VIEW FULL SLATE';
      });

      infoSection.querySelector('.info-toggle').addEventListener('click', function() {
        infoSection.classList.toggle('expanded');
        this.querySelector('.arrow').textContent = infoSection.classList.contains('expanded') ? '▲' : '▼';
      });

      dataSourcesDiv.innerHTML = 'DATA: <a href="https://espn.com" target="_blank">ESPN</a> &bull; <a href="https://the-odds-api.com" target="_blank">THE ODDS API</a>';

      loadSportData('nba');
    })();
  </script>
</body>
</html>
