<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLOP LOCKS</title>
  <meta name="description" content="Sports picks and model edge readouts.">
  <meta name="theme-color" content="#08110b">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    :root {
      --bg: #030503;
      --bg-deep: #010201;
      --panel: rgba(3, 9, 4, 0.94);
      --panel-soft: rgba(5, 15, 7, 0.78);
      --fg: #86ff72;
      --fg-soft: #b9ffaf;
      --fg-dim: #4f9950;
      --fg-faint: rgba(134, 255, 114, 0.55);
      --fg-deep: #15371a;
      --line: rgba(73, 150, 70, 0.45);
      --line-strong: rgba(118, 255, 104, 0.7);
      --accent: #9bff6e;
      --accent-soft: rgba(155, 255, 110, 0.12);
      --danger: #ff6464;
      --shadow: 0 0 0 1px rgba(135, 255, 114, 0.08), 0 0 24px rgba(53, 160, 62, 0.18);
      --font-body: "Share Tech Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      background:
        radial-gradient(circle at top, rgba(20, 56, 18, 0.38), transparent 38%),
        linear-gradient(180deg, #061008 0%, var(--bg) 22%, var(--bg-deep) 100%);
      color-scheme: dark;
    }

    body {
      background: transparent;
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.45;
      min-height: 100vh;
      padding: 24px;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at center, transparent 55%, rgba(0, 0, 0, 0.32) 100%),
        linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.12) 100%);
      z-index: 100;
    }

    @keyframes flicker {
      0% { opacity: 0.1; }
      20% { opacity: 0.14; }
      40% { opacity: 0.09; }
      60% { opacity: 0.16; }
      80% { opacity: 0.12; }
      100% { opacity: 0.1; }
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @keyframes rise-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      background:
        linear-gradient(180deg, rgba(8, 19, 10, 0.95) 0%, rgba(3, 7, 4, 0.98) 100%);
      box-shadow: var(--shadow);
    }

    .container::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(180deg, rgba(138, 255, 117, 0.06) 0 1px, transparent 1px 3px),
        linear-gradient(90deg, rgba(134, 255, 114, 0.05), transparent 10%, transparent 90%, rgba(134, 255, 114, 0.05));
      mix-blend-mode: screen;
      opacity: 0.5;
      z-index: 2;
    }

    .container::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: rgba(16, 18, 16, 0.08);
      animation: flicker 0.16s infinite;
      z-index: 3;
    }

    .site-header {
      position: relative;
      z-index: 1;
      padding: 18px 22px 16px;
      border-bottom: 1px solid var(--line-strong);
      background:
        linear-gradient(180deg, rgba(12, 28, 14, 0.72) 0%, rgba(6, 14, 7, 0.35) 100%);
    }

    .identity-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .eyebrow {
      color: var(--fg-dim);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.24em;
    }

    .wordmark-title {
      color: var(--fg-soft);
      font-size: clamp(2.6rem, 8vw, 5.5rem);
      line-height: 0.92;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(121, 255, 108, 0.22);
    }

    .pill-nav {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(4, 10, 5, 0.9);
    }

    .pill {
      appearance: none;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      color: var(--fg-dim);
      font-family: var(--font-body);
      font-size: 12px;
      line-height: 1;
      padding: 10px 14px;
      cursor: pointer;
      text-transform: uppercase;
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    .pill:hover,
    .pill:focus-visible {
      color: var(--fg-soft);
      border-color: var(--line-strong);
      background: rgba(13, 31, 15, 0.92);
      box-shadow: 0 0 0 1px rgba(134, 255, 114, 0.12);
      outline: none;
    }

    .pill.active {
      color: var(--bg);
      background: var(--accent);
      border-color: var(--accent);
      font-weight: bold;
      box-shadow: 0 0 18px rgba(155, 255, 110, 0.3);
    }

    .pill.active::after {
      content: " _";
      animation: blink 1s step-end infinite;
    }

    #pick-feed {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 12px;
    }

    .status-rail,
    .pick-card,
    .dashboard-card,
    .stats-footer {
      position: relative;
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(7, 18, 9, 0.85) 0%, rgba(3, 8, 4, 0.9) 100%);
      box-shadow: inset 0 1px 0 rgba(140, 255, 120, 0.05);
    }

    .status-rail,
    .pick-card,
    .dashboard-card {
      padding: 10px;
      animation: rise-in 0.26s ease both;
    }

    .status-heading,
    .card-head,
    .card-title-row,
    .footer-block {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .status-heading,
    .card-head {
      margin-bottom: 8px;
    }

    .status-kicker,
    .card-kicker,
    .meta-label,
    .card-odds-label {
      color: var(--fg-dim);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }

    .status-title,
    .card-title {
      color: var(--fg-soft);
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(134, 255, 114, 0.14);
    }

    .status-title {
      font-size: clamp(1.1rem, 1.7vw, 1.45rem);
      line-height: 1;
      margin-top: 3px;
    }

    .feed-message {
      min-height: 240px;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      color: var(--fg-dim);
      text-align: center;
      text-transform: uppercase;
      white-space: pre-line;
      letter-spacing: 0.14em;
      border: 1px solid var(--line);
      background: rgba(4, 10, 5, 0.84);
    }

    .feed-message.is-loading::after {
      content: " _";
      color: var(--fg-soft);
      animation: blink 1s step-end infinite;
    }

    .card-shell {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-title-row {
      align-items: flex-end;
    }

    .card-title-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .card-title {
      font-size: clamp(1.8rem, 3vw, 2.7rem);
      line-height: 0.94;
      word-break: break-word;
    }

    .dashboard-card .card-title {
      font-size: clamp(1.35rem, 2vw, 1.85rem);
    }

    .card-line,
    .card-vs {
      color: var(--fg-dim);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .card-odds-wrap {
      min-width: 82px;
      text-align: right;
    }

    .card-odds {
      font-size: clamp(1.1rem, 1.9vw, 1.55rem);
      color: var(--fg-soft);
      line-height: 1;
    }

    .card-market {
      flex: 0 0 auto;
      align-self: flex-start;
      border: 1px solid var(--line-strong);
      padding: 3px 6px;
      font-size: 9px;
      color: var(--fg-soft);
      background: var(--accent-soft);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      display: inline-block;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
    }

    .detail-item {
      padding: 8px 9px;
      background: rgba(2, 6, 3, 0.94);
    }

    .detail-label {
      display: block;
      color: var(--fg-dim);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      margin-bottom: 3px;
    }

    .detail-value {
      display: block;
      color: var(--fg-soft);
      font-size: 14px;
    }

    .detail-value.stat-good {
      color: var(--fg-soft);
      text-shadow: 0 0 10px rgba(134, 255, 114, 0.18);
    }

    .detail-value.stat-bad {
      color: var(--danger);
    }

    .edge-strip {
      border-top: 1px dashed var(--line);
      padding-top: 8px;
      margin-top: 0;
    }

    .edge-copy {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--fg-soft);
      font-size: 11px;
      line-height: 1.2;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      margin-bottom: 5px;
    }

    .edge-copy span {
      text-shadow: 0 0 8px rgba(134, 255, 114, 0.12);
    }

    .edge-meter {
      height: 4px;
      background: rgba(17, 44, 19, 0.85);
      position: relative;
      overflow: hidden;
    }

    .edge-meter-base {
      background: rgba(88, 157, 82, 0.6);
      height: 100%;
    }

    .edge-meter-edge {
      background: linear-gradient(90deg, rgba(155, 255, 110, 0.5), var(--accent));
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
    }

    .card-blurb {
      border-top: 1px dashed var(--line);
      padding-top: 8px;
      color: var(--fg-faint);
      font-size: 11px;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .status-cell {
      padding: 8px 9px;
      border: 1px solid rgba(73, 150, 70, 0.28);
      background: rgba(2, 6, 3, 0.72);
    }

    .status-cell-label {
      color: var(--fg-dim);
      font-size: 10px;
      display: block;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      margin-bottom: 4px;
    }

    .status-cell-value {
      color: var(--fg-soft);
      font-size: 12px;
      display: block;
    }

    .status-diagnostics {
      margin-top: 8px;
      border-top: 1px solid var(--line);
      padding-top: 8px;
      font-size: 10px;
    }

    .status-list {
      display: grid;
      gap: 4px;
      margin-top: 6px;
    }

    .status-list-item {
      color: var(--fg-faint);
      overflow-wrap: anywhere;
    }

    .dashboard-lines,
    .dashboard-lines-pre {
      border: 1px solid rgba(73, 150, 70, 0.34);
      background: rgba(2, 6, 3, 0.86);
      padding: 10px 12px;
    }

    .dashboard-lines {
      display: grid;
      gap: 7px;
    }

    .dashboard-line {
      color: var(--fg-soft);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .dashboard-lines-pre {
      white-space: pre-wrap;
      font-size: 12px;
      color: var(--fg-soft);
    }

    .stats-footer {
      position: relative;
      z-index: 1;
      padding: 10px 14px;
      border-top: 1px solid var(--line-strong);
      font-size: 11px;
    }

    .footer-block {
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      text-transform: uppercase;
    }

    .footer-item {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .footer-value {
      color: var(--fg-soft);
    }

    @media (max-width: 900px) {
      body {
        padding: 14px;
      }

      #pick-feed {
        padding: 12px;
      }

      .detail-grid,
      .status-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 0;
      }

      .container {
        border-left: none;
        border-right: none;
      }

      .site-header,
      .pill-nav,
      #pick-feed,
      .stats-footer {
        padding-left: 14px;
        padding-right: 14px;
      }

      .status-heading,
      .card-head,
      .footer-block {
        flex-direction: column;
      }

      .card-title-row {
        display: block;
      }

      .card-title-block {
        width: 100%;
      }

      .card-market {
        margin-bottom: 10px;
      }

      .card-odds-wrap {
        min-width: 0;
        text-align: left;
      }

      .card-title {
        font-size: clamp(1.65rem, 11vw, 2.35rem);
      }

      .dashboard-card .card-title {
        font-size: 1.4rem;
      }

      .detail-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .status-grid {
        grid-template-columns: 1fr;
      }

      .edge-copy {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">

    <header class="site-header">
      <div class="identity-block">
        <div class="eyebrow">PICKS // DASHBOARD // ET</div>
        <div class="wordmark-title">SLOP LOCKS</div>
      </div>
    </header>

    <nav class="pill-nav">
      <button class="pill" data-sport="dashboard">BOARD</button>
      <button class="pill active" data-sport="all">ALL</button>
      <button class="pill" data-sport="nba">NBA</button>
      <button class="pill" data-sport="wnba">WNBA</button>
      <button class="pill" data-sport="nhl">NHL</button>
      <button class="pill" data-sport="mlb">MLB</button>
    </nav>

    <main id="pick-feed">
      <div class="feed-message" id="loading-msg">SYNCING...</div>
    </main>

    <footer class="stats-footer" id="stats-footer"></footer>

  </div>

  <script>
(function () {
  'use strict';

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(function () {});
  }

  function formatOdds(american) {
    if (american == null) return '--';
    return american >= 0 ? '+' + american : String(american);
  }

  function formatDate(iso) {
    var d = new Date(iso + 'T12:00:00Z');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' }).toUpperCase();
  }

  function formatWhen(startTime, fallbackDate) {
    if (startTime) {
      var stamp = new Date(startTime);
      if (!isNaN(stamp.getTime())) {
        return stamp.toLocaleString('en-US', {
          month: 'short',
          day: 'numeric',
          hour: 'numeric',
          minute: '2-digit',
          hour12: true,
          timeZone: 'America/New_York'
        }).toUpperCase() + ' ET';
      }
    }
    return formatDate(fallbackDate);
  }

  var SPORT_LABELS = { nba: 'NBA', wnba: 'WNBA', nhl: 'NHL', mlb: 'MLB' };
  function formatSportLabel(sport) {
    return SPORT_LABELS[sport] || sport.toUpperCase();
  }

  function pct(p) { return (p * 100).toFixed(1) + '%'; }
  function units(v) {
    if (v == null) return '--';
    return (v >= 0 ? '+' : '') + v.toFixed(2) + 'u';
  }
  function edgePct(v) {
    if (v == null) return '--';
    return (v >= 0 ? '+' : '') + (v * 100).toFixed(1) + '%';
  }
  function confidenceText(score, stars) {
    if (score != null && score !== '') {
      return Math.round(Number(score)) + '/100';
    }
    if (stars != null && stars !== '') {
      return Math.round(Number(stars) * 20) + '/100';
    }
    return '--';
  }
  function formatStamp(stamp) {
    if (!stamp) return '--';
    var d = new Date(stamp);
    if (isNaN(d.getTime())) return stamp;
    return d.toLocaleString('en-US', {
      month: 'short',
      day: 'numeric',
      hour: 'numeric',
      minute: '2-digit'
    }).toUpperCase();
  }
  function fmtPct(value, digits) {
    if (value == null || value === '') return '--';
    return (Number(value) * 100).toFixed(digits == null ? 1 : digits) + '%';
  }
  function fmtSignedPct(value, digits) {
    if (value == null || value === '') return '--';
    var num = Number(value) * 100;
    return (num >= 0 ? '+' : '') + num.toFixed(digits == null ? 1 : digits) + '%';
  }
  function fmtRecord(summary) {
    if (!summary) return '--';
    var base = String(summary.record || '--');
    if (summary.pending) base += ' (' + summary.pending + ' pending)';
    return base;
  }
  function fmtRatio(a, b) {
    return String(a || 0) + '/' + String(b || 0);
  }
  function clamp01(value) {
    var num = Number(value);
    if (isNaN(num)) return 0;
    return Math.max(0, Math.min(1, num));
  }
  function createMetric(label, value, tone) {
    var item = document.createElement('div');
    item.className = 'detail-item';

    var labelEl = document.createElement('span');
    labelEl.className = 'detail-label';
    labelEl.textContent = label;
    item.appendChild(labelEl);

    var valueEl = document.createElement('span');
    valueEl.className = 'detail-value' + (tone ? ' ' + tone : '');
    valueEl.textContent = value;
    item.appendChild(valueEl);

    return item;
  }
  function createStatusCell(label, value) {
    var cell = document.createElement('div');
    cell.className = 'status-cell';

    var labelEl = document.createElement('span');
    labelEl.className = 'status-cell-label';
    labelEl.textContent = label;
    cell.appendChild(labelEl);

    var valueEl = document.createElement('span');
    valueEl.className = 'status-cell-value';
    valueEl.textContent = value;
    cell.appendChild(valueEl);

    return cell;
  }
  function setStatsFooter(items) {
    statsFooter.innerHTML = '';

    var block = document.createElement('div');
    block.className = 'footer-block';

    items.forEach(function (item) {
      var row = document.createElement('div');
      row.className = 'footer-item';

      var label = document.createElement('span');
      label.className = 'meta-label';
      label.textContent = item.label;
      row.appendChild(label);

      var value = document.createElement('span');
      value.className = 'footer-value';
      value.textContent = item.value;
      row.appendChild(value);

      block.appendChild(row);
    });

    statsFooter.appendChild(block);
  }
  function setStatsPlaceholder() {
    setStatsFooter([
      { label: 'RECORD', value: '--' },
      { label: 'HIT_RATE', value: '--' },
      { label: 'ROI', value: '--' }
    ]);
  }
  function createDashboardBlock(title, lines, accent, options) {
    options = options || {};

    var card = document.createElement('article');
    card.className = 'pick-card dashboard-card';

    var shell = document.createElement('div');
    shell.className = 'card-shell';

    var head = document.createElement('div');
    head.className = 'card-head';
    head.innerHTML = '<span class="card-kicker">REPORT</span>';
    shell.appendChild(head);

    var titleEl = document.createElement('div');
    titleEl.className = 'card-title';
    titleEl.textContent = title.toUpperCase();
    shell.appendChild(titleEl);

    var tag = document.createElement('div');
    tag.className = 'card-market';
    tag.textContent = accent || 'DATA';
    shell.appendChild(tag);

    var body = document.createElement('div');
    if (options.preformatted) {
      body.className = 'dashboard-lines-pre';
      body.textContent = lines.join('\n');
    } else {
      body.className = 'dashboard-lines';
      lines.forEach(function (line) {
        var row = document.createElement('div');
        row.className = 'dashboard-line';
        row.textContent = line;
        body.appendChild(row);
      });
    }
    shell.appendChild(body);

    card.appendChild(shell);
    return card;
  }

  function createActionPrefix(priority) {
    if (priority === 'high') return '[!]'
    if (priority === 'medium') return '[+]'
    return '[-]'
  }

  function createPickCard(pick) {
    var isTotal = pick.market_type === 'total';
    var pickedTeam = isTotal
      ? (pick.pick || '').toUpperCase() + (pick.total_line != null ? ' ' + pick.total_line : '')
      : (pick.pick === 'home' ? pick.home_team : pick.away_team);
    var opponent   = isTotal
      ? pick.home_team + ' VS ' + pick.away_team
      : (pick.pick === 'home' ? pick.away_team : pick.home_team);

    var card = document.createElement('article');
    card.className = 'pick-card';

    var shell = document.createElement('div');
    shell.className = 'card-shell';

    var head = document.createElement('div');
    head.className = 'card-head';
    head.innerHTML = '<span class="card-kicker">' + formatSportLabel(pick.sport) + ' // ' + formatWhen(pick.start_time, pick.date) + '</span>';

    var oddsWrap = document.createElement('div');
    oddsWrap.className = 'card-odds-wrap';

    var oddsLabel = document.createElement('div');
    oddsLabel.className = 'card-odds-label';
    // Fallback: all markets render into the same odds slot because the payload only exposes one American odds field.
    oddsLabel.textContent = 'ODDS';
    oddsWrap.appendChild(oddsLabel);

    var oddsValue = document.createElement('div');
    oddsValue.className = 'card-odds';
    oddsValue.textContent = formatOdds(pick.american_odds);
    oddsWrap.appendChild(oddsValue);

    head.appendChild(oddsWrap);
    shell.appendChild(head);

    var titleRow = document.createElement('div');
    titleRow.className = 'card-title-row';

    var titleBlock = document.createElement('div');
    titleBlock.className = 'card-title-block';

    var title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = pickedTeam.toUpperCase();
    titleBlock.appendChild(title);

    var versus = document.createElement('div');
    versus.className = 'card-line card-vs';
    versus.textContent = isTotal
      ? pick.home_team.toUpperCase() + ' VS ' + pick.away_team.toUpperCase()
      : 'VS ' + opponent.toUpperCase();
    titleBlock.appendChild(versus);

    titleRow.appendChild(titleBlock);

    var marketTag = document.createElement('div');
    marketTag.className = 'card-market';
    marketTag.textContent = isTotal ? 'TOTAL' : 'ML';
    titleRow.appendChild(marketTag);

    if (pick.qualitative_summary && pick.qualitative_summary !== 'No qualitative impact.') {
      var senseTag = document.createElement('div');
      senseTag.className = 'card-market';
      senseTag.style.marginLeft = '6px';
      senseTag.style.borderColor = '#ff72f9';
      senseTag.style.color = '#ffbafc';
      senseTag.style.background = 'rgba(255, 114, 249, 0.1)';
      senseTag.textContent = 'SENSE';
      titleRow.appendChild(senseTag);
    }
    shell.appendChild(titleRow);

    var marketSnapshot = pick.market_snapshot || {};
    var marketBench = marketSnapshot.benchmark || {};

    var details = document.createElement('div');
    details.className = 'detail-grid';
    details.appendChild(createMetric('MODEL', fmtPct(pick.model_prob), null));
    details.appendChild(createMetric('BOOKS', marketBench.books_tracked || '--', null));
    details.appendChild(createMetric('EDGE', edgePct(pick.edge), (pick.edge || 0) >= 0 ? 'stat-good' : 'stat-bad'));
    details.appendChild(createMetric(isTotal ? 'PROJ' : 'EV', isTotal
      ? (pick.expected_total != null ? pick.expected_total.toFixed(1) : '--')
      : units(pick.expected_value), null));
    details.appendChild(createMetric('CONF', confidenceText(pick.confidence_score, pick.confidence_stars), null));
    details.appendChild(createMetric('HOLD', marketBench.hold != null ? (marketBench.hold * 100).toFixed(1) + '%' : '--', null));
    shell.appendChild(details);

    var edgeStrip = document.createElement('div');
    edgeStrip.className = 'edge-strip';

    var edgeCopy = document.createElement('div');
    edgeCopy.className = 'edge-copy';
    edgeCopy.innerHTML =
      '<span>MARKET ' + fmtPct(pick.implied_prob) + '</span>' +
      '<span>MODEL ' + fmtPct(pick.model_prob) + '</span>';
    edgeStrip.appendChild(edgeCopy);

    var meter = document.createElement('div');
    meter.className = 'edge-meter';

    var base = document.createElement('div');
    base.className = 'edge-meter-base';
    base.style.width = (clamp01(pick.implied_prob) * 100).toFixed(1) + '%';
    meter.appendChild(base);

    var edge = document.createElement('div');
    edge.className = 'edge-meter-edge';
    edge.style.width = (Math.max(0, clamp01(pick.model_prob) - clamp01(pick.implied_prob)) * 100).toFixed(1) + '%';
    meter.appendChild(edge);

    edgeStrip.appendChild(meter);
    shell.appendChild(edgeStrip);

    card.appendChild(shell);

    if (pick.qualitative_summary && pick.qualitative_summary.trim() !== '' && pick.qualitative_summary !== 'No qualitative impact.') {
      var senseEl = document.createElement('div');
      senseEl.className = 'card-blurb sense-blurb';
      senseEl.style.color = '#ffbafc';
      senseEl.style.borderLeft = '2px solid #ff72f9';
      senseEl.style.paddingLeft = '8px';
      senseEl.style.marginTop = '8px';
      senseEl.innerHTML = '<span style="font-weight:bold; color:#ff72f9; font-size:9px; letter-spacing:1px;">GEMINI_SENSE</span><br>' + pick.qualitative_summary;
      card.appendChild(senseEl);
    }

    if (pick.blurb && pick.blurb.trim() !== '') {
      var blurbEl = document.createElement('div');
      blurbEl.className = 'card-blurb';
      blurbEl.textContent = pick.blurb;
      card.appendChild(blurbEl);
    }

    return card;
  }

  var feed = document.getElementById('pick-feed');
  var statsFooter = document.getElementById('stats-footer');
  var currentSport = 'all';
  var loadedSportsData = {};
  var dashboardData = null;

  function clearFeed() {
    while (feed.firstChild) {
      feed.removeChild(feed.firstChild);
    }
  }

  function showMessage(text, pulse) {
    clearFeed();
    var el = document.createElement('div');
    el.className = 'feed-message';
    if (pulse) el.classList.add('is-loading');
    el.textContent = text;
    feed.appendChild(el);
  }

  function createStatusRail(mode, picks) {
    var el = document.createElement('section');
    el.className = 'status-rail';

    var label = mode === 'all' ? 'ALL SPORTS' : (mode === 'dashboard' ? 'DASHBOARD' : formatSportLabel(mode));
    var generated = '--';
    if (mode === 'dashboard') {
      generated = formatStamp((dashboardData || {}).generated_at || (dashboardData || {}).manifest_updated_at || '');
    } else if (mode === 'all') {
      // Fallback: for the combined view, use the newest available sport timestamp instead of inventing a synthetic sync time.
      var stamps = Object.keys(loadedSportsData).map(function (sport) {
        var data = loadedSportsData[sport] || {};
        return data.generated_at || data.updated_at || '';
      }).filter(Boolean);
      if (stamps.length) generated = formatStamp(stamps.sort().slice(-1)[0]);
    } else {
      var data = loadedSportsData[mode] || {};
      generated = formatStamp(data.generated_at || data.updated_at || '');
    }

    var diagnosticLines = [];
    if (mode === 'dashboard') {
      var slate = ((dashboardData || {}).aggregate || {}).slate || {};
      diagnosticLines.push(
        'slate modeled=' + (slate.modeled || 0) +
        ' | odds=' + fmtRatio(slate.with_odds, slate.fixtures) +
        ' | +ev=' + (slate.positive_ev || 0) +
        ' | sense=' + (slate.sense || 0) +
        ' | eligible=' + (slate.eligible || 0) +
        ' | locks=' + (slate.locks || 0)
      );
    } else if (mode === 'all') {
      ALL_SPORTS.forEach(function (sport) {
        var sportData = loadedSportsData[sport] || {};
        var diagnostics = sportData.diagnostics || {};
        if (!diagnostics.summary) return;
        var line = formatSportLabel(sport) + ': ' + diagnostics.summary;
        if ((sportData.totals_locks || []).length) {
          line += ' | totals=' + sportData.totals_locks.length;
        }
        diagnosticLines.push(line);
      });
    } else {
      var currentData = loadedSportsData[mode] || {};
      var currentDiagnostics = currentData.diagnostics || {};
      if (currentDiagnostics.summary) {
        var currentLine = currentDiagnostics.summary;
        if ((currentData.totals_locks || []).length) {
          currentLine += ' | totals=' + currentData.totals_locks.length;
        }
        diagnosticLines.push(currentLine);
        if ((currentDiagnostics.coverage_gap_examples || []).length) {
          diagnosticLines.push('missing: ' + currentDiagnostics.coverage_gap_examples.slice(0, 2).join(', '));
        }
      }
    }

    var heading = document.createElement('div');
    heading.className = 'status-heading';

    var headingCopy = document.createElement('div');
    headingCopy.innerHTML =
      '<div class="status-kicker">VIEW</div>' +
      '<div class="status-title">' + label + '</div>';
    heading.appendChild(headingCopy);

    var updated = document.createElement('div');
    updated.className = 'status-kicker';
    updated.textContent = 'UPDATED ' + generated;
    heading.appendChild(updated);
    el.appendChild(heading);

    var grid = document.createElement('div');
    grid.className = 'status-grid';
    grid.appendChild(createStatusCell('MODE', label));
    grid.appendChild(createStatusCell('LOCKS', String(picks ? picks.length : 0)));
    grid.appendChild(createStatusCell('UPDATED', generated));
    el.appendChild(grid);

    if (diagnosticLines.length) {
      var diag = document.createElement('div');
      diag.className = 'status-diagnostics';

      var diagLabel = document.createElement('div');
      diagLabel.className = 'status-kicker';
      diagLabel.textContent = 'LOG';
      diag.appendChild(diagLabel);

      var list = document.createElement('div');
      list.className = 'status-list';
      diagnosticLines.forEach(function (line) {
        var item = document.createElement('div');
        item.className = 'status-list-item';
        item.textContent = line;
        list.appendChild(item);
      });
      diag.appendChild(list);
      el.appendChild(diag);
    }

    return el;
  }

  function renderDashboard() {
    clearFeed();
    if (!dashboardData) {
      showMessage('[ NO BOARD ]\n\nDashboard data unavailable.', false);
      return;
    }

    feed.appendChild(createStatusRail('dashboard', []));

    var aggregate = dashboardData.aggregate || {};
    var record = aggregate.record || {};
    var predictions = aggregate.predictions || {};
    var slate = aggregate.slate || {};
    var leaders = dashboardData.leaders || {};
    var windows = dashboardData.windows || {};
    var snapshotReplay = dashboardData.snapshot_replay || {};
    var actions = dashboardData.recommended_actions || [];

    feed.appendChild(createDashboardBlock('Board', [
      'RECORD      ' + fmtRecord(record),
      'HIT RATE    ' + fmtPct(record.hit_rate),
      'ROI         ' + fmtSignedPct(record.roi),
      'AVG CONF    ' + (record.avg_confidence != null ? Math.round(record.avg_confidence) + '/100' : '--'),
      'AVG EV      ' + units(record.avg_expected_value),
      'CLV         ' + fmtSignedPct(record.avg_clv, 2),
      'PRED ACC    ' + fmtPct(predictions.accuracy),
      'LOG LOSS    ' + (predictions.avg_log_loss != null ? Number(predictions.avg_log_loss).toFixed(3) : '--'),
      'SLATE NOW   modeled=' + (slate.modeled || 0) + ' | odds=' + fmtRatio(slate.with_odds, slate.fixtures) + ' | +ev=' + (slate.positive_ev || 0) + ' | sense=' + (slate.sense || 0) + ' | locks=' + (slate.locks || 0)
    ], 'GEMINI'));

    feed.appendChild(createDashboardBlock('Recent', [
      'LAST 7D     ' + fmtRecord(windows['7d']) + ' | HIT ' + fmtPct((windows['7d'] || {}).hit_rate) + ' | ROI ' + fmtSignedPct((windows['7d'] || {}).roi),
      'LAST 30D    ' + fmtRecord(windows['30d']) + ' | HIT ' + fmtPct((windows['30d'] || {}).hit_rate) + ' | ROI ' + fmtSignedPct((windows['30d'] || {}).roi),
      '7D CLV      ' + fmtSignedPct(((windows['7d'] || {}).clv || {}).avg_clv, 2),
      '30D CLV     ' + fmtSignedPct(((windows['30d'] || {}).clv || {}).avg_clv, 2)
    ], 'WINDOW'));

    var replayAgg = (dashboardData.decision_replay || {}).aggregate || {};
    var replaySettled = replayAgg.settled_picks || {};
    feed.appendChild(createDashboardBlock('Slop Replay', [
      'LOGGED      ' + String(replayAgg.logged_picks || 0) + ' PICKS',
      'SETTLED     ' + fmtRatio(replaySettled.evaluated, replayAgg.logged_picks),
      'HIT RATE    ' + fmtPct(replaySettled.hit_rate),
      'REPLAY ROI  ' + fmtSignedPct(replaySettled.roi),
      'REPLAY CLV  ' + fmtSignedPct((replaySettled.clv || {}).avg_clv, 2),
      'SNAPSHOTS   ' + String((snapshotReplay.aggregate || {}).snapshots || 0) + ' RUNS',
      'SYNC RATE   ' + fmtPct((snapshotReplay.aggregate || {}).exact_match_rate)
    ], 'LEDGER'));

    if (actions.length) {
      feed.appendChild(createDashboardBlock('Queue', actions.map(function (action, idx) {
        return createActionPrefix(action.priority) + ' ' + action.title.toUpperCase() + '\n    ' + action.detail;
      }), 'TASKS'));
    }

    var sportLines = ['SPORT   REC        HIT      ROI      CLV      LIVE    SENSE'];
    (dashboardData.sports || []).forEach(function (sport) {
      sportLines.push(
        (sport.name || '').padEnd(6, ' ').slice(0, 6) + ' ' +
        fmtRecord(sport.performance).padEnd(10, ' ').slice(0, 10) + ' ' +
        fmtPct(sport.performance.hit_rate).padEnd(8, ' ').slice(0, 8) + ' ' +
        fmtSignedPct(sport.performance.roi).padEnd(8, ' ').slice(0, 8) + ' ' +
        fmtSignedPct((sport.performance.clv || {}).avg_clv || sport.performance.avg_clv, 2).padEnd(8, ' ').slice(0, 8) + ' ' +
        String((sport.current.locks || 0) + 'L/' + (sport.current.totals || 0) + 'T').padEnd(7, ' ').slice(0, 7) + ' ' +
        String(sport.current.sense || 0)
      );
    });
    feed.appendChild(createDashboardBlock('Sports', sportLines, 'SPLITS', { preformatted: true }));

    var leaderLines = [];
    if (leaders.best_roi_sport) {
      leaderLines.push('BEST ROI    ' + leaders.best_roi_sport.name + ' ' + fmtSignedPct(leaders.best_roi_sport.roi));
    }
    if (leaders.best_clv_sport) {
      leaderLines.push('BEST ML CLV ' + leaders.best_clv_sport.name + ' ' + fmtSignedPct(leaders.best_clv_sport.avg_clv, 2));
    }
    if (leaders.best_lane) {
      leaderLines.push('BEST LANE   ' + String(leaders.best_lane.lane).toUpperCase() + ':' + leaders.best_lane.key + ' ' + fmtSignedPct(leaders.best_lane.roi));
    }
    ((aggregate.threshold_guidance || []).slice(0, 3)).forEach(function (line, idx) {
      leaderLines.push('GUIDE ' + (idx + 1) + '    ' + line);
    });
    feed.appendChild(createDashboardBlock('Leaders', leaderLines, 'LEAD'));

    if ((dashboardData.insights || []).length) {
      var insightLines = (dashboardData.insights || []).map(function (line, idx) {
        return (idx + 1) + '. ' + line;
      });
      feed.appendChild(createDashboardBlock('Notes', insightLines, 'LOG'));
    }
  }

  function renderFeed(picks) {
    if (!picks || picks.length === 0) {
      showMessage('[ NO PICKS ]\n\nTry another tab later.', false);
      return;
    }
    clearFeed();
    feed.appendChild(createStatusRail(currentSport, picks));
    picks.forEach(function (pick) {
      feed.appendChild(createPickCard(pick));
    });
  }

  function renderStats(mode) {
    if (mode === 'dashboard') {
      var record = ((dashboardData || {}).aggregate || {}).record || {};
      if (record.hit_rate == null) {
        setStatsPlaceholder();
      } else {
        setStatsFooter([
          { label: 'RECORD', value: record.record || '--' },
          { label: 'HIT_RATE', value: fmtPct(record.hit_rate) },
          { label: 'ROI', value: fmtSignedPct(record.roi) }
        ]);
      }
      return;
    }
    if (mode === 'all') {
      var wins = 0, losses = 0, evaluated = 0, roiWeightedSum = 0, roiWeight = 0;
      Object.keys(loadedSportsData).forEach(function (sport) {
        var ps = (loadedSportsData[sport].pick_stats || {}).all || {};
        wins      += ps.wins      || 0;
        losses    += ps.losses    || 0;
        evaluated += ps.evaluated || 0;
        if (ps.roi != null && ps.evaluated) {
          // Fallback: aggregate all-sport ROI by weighting each sport ROI by its evaluated picks because
          // the payload does not expose a unified cross-sport return series or total stake basis.
          roiWeightedSum += ps.roi * ps.evaluated;
          roiWeight += ps.evaluated;
        }
      });
      var hitRate = evaluated > 0 ? wins / evaluated : null;
      var roiAll = roiWeight > 0 ? roiWeightedSum / roiWeight : null;
      if (hitRate === null) {
        setStatsPlaceholder();
      } else {
        setStatsFooter([
          { label: 'RECORD', value: wins + '-' + losses },
          { label: 'HIT_RATE', value: (hitRate * 100).toFixed(1) + '%' },
          { label: 'ROI', value: roiAll != null ? ((roiAll >= 0 ? '+' : '') + (roiAll * 100).toFixed(1) + '%') : '--' }
        ]);
      }
      return;
    }

    var data = loadedSportsData[mode];
    if (!data) { setStatsPlaceholder(); return; }
    var ps = (data.pick_stats || {}).all || {};
    var hitRate = ps.hit_rate != null ? ps.hit_rate : null;
    var roi     = ps.roi      != null ? ps.roi      : null;
    if (hitRate === null) {
      setStatsPlaceholder();
    } else {
      setStatsFooter([
        { label: 'RECORD', value: (ps.wins || 0) + '-' + (ps.losses || 0) },
        { label: 'HIT_RATE', value: (hitRate * 100).toFixed(1) + '%' },
        { label: 'ROI', value: roi != null ? ((roi >= 0 ? '+' : '') + (roi * 100).toFixed(1) + '%') : '--' }
      ]);
    }
  }

  var ALL_SPORTS = ['nba', 'wnba', 'nhl', 'mlb'];

  function loadDashboard() {
    currentSport = 'dashboard';
    showMessage('[ LOADING BOARD ]', true);
    fetch('data/dashboard.json?t=' + Date.now())
      .then(function (res) {
        if (!res.ok) throw new Error(res.status);
        return res.json();
      })
      .then(function (data) {
        dashboardData = data;
        renderDashboard();
        renderStats('dashboard');
      })
      .catch(function () {
        showMessage('[ BOARD ERROR ]\n\nDashboard data invalid.', false);
        setStatsPlaceholder();
      });
  }

  function loadAllSports() {
    currentSport = 'all';
    loadedSportsData = {};
    showMessage('[ LOADING FEEDS ]', true);

    var fetches = ALL_SPORTS.map(function (sport) {
      return fetch('data/' + sport + '/predictions.json?t=' + Date.now())
        .then(function (res) {
          if (!res.ok) throw new Error(res.status);
          return res.json();
        })
        .then(function (data) { return { sport: sport, data: data }; });
    });

    Promise.allSettled(fetches).then(function (results) {
      var allPicks = [];

      results.forEach(function (result) {
        if (result.status !== 'fulfilled') return;
        var sport = result.value.sport;
        var data  = result.value.data;
        loadedSportsData[sport] = data;

        (data.slop_locks || []).forEach(function (pick) {
          pick.sport = sport; // tag with source sport key
          allPicks.push(pick);
        });
        (data.totals_locks || []).forEach(function (pick) {
          pick.sport = sport;
          allPicks.push(pick);
        });
      });

      if (Object.keys(loadedSportsData).length === 0) {
        showMessage('[ DATA ERROR ]\n\nNo sport files loaded.', false);
        setStatsPlaceholder();
        return;
      }

      allPicks.sort(function (a, b) {
        var ta = a.start_time ? new Date(a.start_time).getTime() : Infinity;
        var tb = b.start_time ? new Date(b.start_time).getTime() : Infinity;
        return ta - tb;
      });
      renderFeed(allPicks);
      renderStats('all');
    });
  }

  function loadSportData(sport) {
    currentSport = sport;
    showMessage('[ LOADING ' + formatSportLabel(sport) + ' ]', true);

    fetch('data/' + sport + '/predictions.json?t=' + Date.now())
      .then(function (res) {
        if (!res.ok) throw new Error(res.status);
        return res.json();
      })
      .then(function (data) {
        loadedSportsData[sport] = data;
        var locks = (data.slop_locks || []).concat(data.totals_locks || []);
        locks.forEach(function (pick) { pick.sport = sport; });
        locks.sort(function (a, b) {
          var ta = a.start_time ? new Date(a.start_time).getTime() : Infinity;
          var tb = b.start_time ? new Date(b.start_time).getTime() : Infinity;
          return ta - tb;
        });
        renderFeed(locks);
        renderStats(sport);
      })
      .catch(function () {
        showMessage('[ ' + formatSportLabel(sport) + ' ERROR ]\n\nMissing or invalid JSON.', false);
        setStatsPlaceholder();
      });
  }

  document.querySelectorAll('.pill').forEach(function (pill) {
    pill.addEventListener('click', function () {
      var sport = this.getAttribute('data-sport');
      if (sport === currentSport) return;

      document.querySelectorAll('.pill').forEach(function (p) {
        p.classList.remove('active');
      });
      this.classList.add('active');

      if (sport === 'dashboard') {
        loadDashboard();
      } else if (sport === 'all') {
        loadAllSports();
      } else {
        loadSportData(sport);
      }
    });
  });

  setStatsPlaceholder();
  loadAllSports();

})();
  </script>
</body>
</html>
