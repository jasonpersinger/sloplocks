<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLOP LOCKS</title>
  <meta name="description" content="Daily sports picks with model edge.">
  <meta name="theme-color" content="#101010">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <style>
    :root {
      --bg: #101010;
      --bg-soft: #151515;
      --fg: #d7d2bf;
      --fg-dim: #8d8777;
      --line: #3e3a31;
      --accent: #8fce00;
      --accent-soft: #577c00;
      --danger: #d98c3f;
      --font-mono: "Courier New", Courier, monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background:
        linear-gradient(to bottom, rgba(255,255,255,0.03), rgba(255,255,255,0)) 0 0 / 100% 3px,
        var(--bg);
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 15px;
      line-height: 1.45;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      border: 1px solid var(--line);
      background: var(--bg-soft);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    .site-header {
      padding: 18px 18px 8px;
      border-bottom: 1px solid var(--line);
    }

    .ascii-logo {
      color: var(--accent);
      font-size: 14px;
      line-height: 1.1;
      white-space: pre;
      overflow-x: auto;
    }

    .subtitle-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding-top: 10px;
      color: var(--fg-dim);
      font-size: 12px;
      text-transform: uppercase;
    }

    .pill-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
    }

    .pill {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--fg-dim);
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 6px 10px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
      transition: none;
    }

    .pill::before { content: "[ "; }
    .pill::after { content: " ]"; }
    .pill.active {
      color: var(--accent);
      border-color: var(--accent-soft);
      background: rgba(143, 206, 0, 0.06);
    }

    #pick-feed {
      display: flex;
      flex-direction: column;
      padding: 18px;
      gap: 14px;
      min-height: 320px;
    }

    .status-rail {
      border: 1px dashed var(--line);
      background: #111;
      color: var(--fg-dim);
      padding: 10px 12px;
      font-size: 13px;
      white-space: pre-wrap;
    }

    .feed-message {
      border: 1px dashed var(--line);
      padding: 24px 16px;
      color: var(--fg-dim);
      white-space: pre-wrap;
    }

    .pick-card {
      border: 1px solid var(--line);
      background: #121212;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ascii-box {
      border: 1px solid var(--line);
      padding: 10px;
      background: #0f0f0f;
    }

    .card-head,
    .meta-grid,
    .footer-grid {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .label {
      color: var(--fg-dim);
    }

    .card-title {
      color: var(--accent);
      font-size: 18px;
      text-transform: uppercase;
    }

    .card-line {
      text-transform: uppercase;
      color: var(--fg);
      font-size: 13px;
    }

    .card-vs {
      color: var(--fg-dim);
    }

    .card-blurb {
      color: var(--fg-dim);
      white-space: pre-wrap;
      border-top: 1px dashed var(--line);
      padding-top: 10px;
    }

    .stat-good { color: var(--accent); }
    .stat-bad { color: var(--danger); }

    .stats-footer {
      border-top: 1px solid var(--line);
      padding: 14px 18px 18px;
      color: var(--fg-dim);
      font-size: 13px;
      white-space: pre-wrap;
    }

    .footer-block {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    @media (max-width: 640px) {
      body {
        padding: 0;
      }

      .container {
        border-left: 0;
        border-right: 0;
        min-height: 100vh;
      }

      .ascii-logo {
        font-size: 11px;
      }

      #pick-feed {
        padding: 12px;
      }

      .card-title {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">

    <header class="site-header">
      <pre class="ascii-logo">========================================
 S L O P   L O C K S
========================================</pre>
      <div class="subtitle-row">
        <div>DAILY PICKS // TEXT MODE // NO FRILLS</div>
        <div id="header-date"></div>
      </div>
    </header>

    <nav class="pill-nav">
      <button class="pill" data-sport="dashboard">DASHBOARD</button>
      <button class="pill active" data-sport="all">ALL</button>
      <button class="pill" data-sport="nba">NBA</button>
      <button class="pill" data-sport="nhl">NHL</button>
      <button class="pill" data-sport="ncaam">NCAAM</button>
      <button class="pill" data-sport="mlb">MLB</button>
      <button class="pill" data-sport="mma">MMA</button>
    </nav>

    <main id="pick-feed">
      <div class="feed-message" id="loading-msg">LOADING SCOREBOARD...</div>
    </main>

    <footer class="stats-footer" id="stats-footer">RECORD -- | HIT RATE -- | ROI --</footer>

  </div>

  <script>
(function () {
  'use strict';

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(function () {});
  }

  document.getElementById('header-date').textContent =
    new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }).toUpperCase();

  function formatOdds(american) {
    if (american == null) return '--';
    return american >= 0 ? '+' + american : String(american);
  }

  function formatDate(iso) {
    var d = new Date(iso + 'T12:00:00Z');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' }).toUpperCase();
  }

  function formatWhen(startTime, fallbackDate) {
    if (startTime) {
      var stamp = new Date(startTime);
      if (!isNaN(stamp.getTime())) {
        return stamp.toLocaleString('en-US', {
          month: 'short',
          day: 'numeric',
          hour: 'numeric',
          minute: '2-digit',
          hour12: true,
          timeZone: 'America/New_York'
        }).toUpperCase() + ' ET';
      }
    }
    return formatDate(fallbackDate);
  }

  var SPORT_LABELS = { nba: 'NBA', nhl: 'NHL', ncaam: 'NCAAM', mlb: 'MLB', mma: 'MMA' };
  function formatSportLabel(sport) {
    return SPORT_LABELS[sport] || sport.toUpperCase();
  }

  function pct(p) { return (p * 100).toFixed(1) + '%'; }
  function units(v) {
    if (v == null) return '--';
    return (v >= 0 ? '+' : '') + v.toFixed(2) + 'u';
  }
  function edgePct(v) {
    if (v == null) return '--';
    return (v >= 0 ? '+' : '') + (v * 100).toFixed(1) + '%';
  }
  function confidenceText(score, stars) {
    if (score != null && score !== '') {
      return Math.round(Number(score)) + '/100';
    }
    if (stars != null && stars !== '') {
      return Math.round(Number(stars) * 20) + '/100';
    }
    return '--';
  }
  function formatStamp(stamp) {
    if (!stamp) return '--';
    var d = new Date(stamp);
    if (isNaN(d.getTime())) return stamp;
    return d.toLocaleString('en-US', {
      month: 'short',
      day: 'numeric',
      hour: 'numeric',
      minute: '2-digit'
    }).toUpperCase();
  }
  function fmtPct(value, digits) {
    if (value == null || value === '') return '--';
    return (Number(value) * 100).toFixed(digits == null ? 1 : digits) + '%';
  }
  function fmtSignedPct(value, digits) {
    if (value == null || value === '') return '--';
    var num = Number(value) * 100;
    return (num >= 0 ? '+' : '') + num.toFixed(digits == null ? 1 : digits) + '%';
  }
  function fmtRecord(summary) {
    if (!summary) return '--';
    var base = String(summary.record || '--');
    if (summary.pending) base += ' (' + summary.pending + ' pending)';
    return base;
  }
  function fmtRatio(a, b) {
    return String(a || 0) + '/' + String(b || 0);
  }
  function createDashboardBlock(title, lines, accent) {
    var card = document.createElement('article');
    card.className = 'pick-card';
    var box = document.createElement('div');
    box.className = 'ascii-box';

    var head = document.createElement('div');
    head.className = 'card-head';
    head.innerHTML =
      '<span class="label">[ DASHBOARD ]</span>' +
      '<span class="label">' + (accent || '') + '</span>';
    box.appendChild(head);

    var titleEl = document.createElement('div');
    titleEl.className = 'card-title';
    titleEl.textContent = '> ' + title.toUpperCase();
    box.appendChild(titleEl);

    var body = document.createElement('div');
    body.className = 'card-blurb';
    body.style.borderTop = '0';
    body.style.paddingTop = '6px';
    body.textContent = lines.join('\n');
    box.appendChild(body);

    card.appendChild(box);
    return card;
  }

  function createActionPrefix(priority) {
    if (priority === 'high') return '[!]'
    if (priority === 'medium') return '[+]'
    return '[-]'
  }

  function createPickCard(pick) {
    var isTotal = pick.market_type === 'total';
    var pickedTeam = isTotal
      ? (pick.pick || '').toUpperCase() + (pick.total_line != null ? ' ' + pick.total_line : '')
      : (pick.pick === 'home' ? pick.home_team : pick.away_team);
    var opponent   = isTotal
      ? pick.home_team + ' VS ' + pick.away_team
      : (pick.pick === 'home' ? pick.away_team : pick.home_team);

    var card = document.createElement('article');
    card.className = 'pick-card';

    var box = document.createElement('div');
    box.className = 'ascii-box';

    var head = document.createElement('div');
    head.className = 'card-head';
    head.innerHTML =
      '<span class="label">[' + formatSportLabel(pick.sport) + ' // ' + formatWhen(pick.start_time, pick.date) + ']</span>' +
      '<span class="label">ODDS ' + formatOdds(pick.american_odds) + '</span>';
    box.appendChild(head);

    var title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = '> ' + pickedTeam.toUpperCase();
    box.appendChild(title);

    var versus = document.createElement('div');
    versus.className = 'card-line card-vs';
    versus.textContent = '  VS ' + opponent.toUpperCase();
    box.appendChild(versus);

    var meta = document.createElement('div');
    meta.className = 'meta-grid';
    meta.innerHTML =
      '<span><span class="label">MODEL</span> ' + pct(pick.model_prob) + '</span>' +
      '<span><span class="label">' + (isTotal ? 'LINE' : 'FAIR') + '</span> ' + (isTotal ? (pick.total_line != null ? pick.total_line : '--') : pct(pick.implied_prob || 0)) + '</span>' +
      '<span class="' + ((pick.edge || 0) >= 0 ? 'stat-good' : 'stat-bad') + '"><span class="label">EDGE</span> ' + edgePct(pick.edge || 0) + '</span>';
    box.appendChild(meta);

    var footer = document.createElement('div');
    footer.className = 'footer-grid';
    footer.innerHTML =
      '<span><span class="label">' + (isTotal ? 'PROJ' : 'EV') + '</span> ' + (isTotal ? (pick.expected_total != null ? pick.expected_total.toFixed(1) : '--') : units(pick.expected_value)) + '</span>' +
      '<span><span class="label">CONF</span> ' + confidenceText(pick.confidence_score, pick.confidence_stars) + '</span>' +
      '<span><span class="label">KELLY</span> ' + (pick.fractional_kelly != null ? (pick.fractional_kelly * 100).toFixed(1) + '%' : '--') + '</span>';
    box.appendChild(footer);

    card.appendChild(box);

    if (pick.blurb && pick.blurb.trim() !== '') {
      var blurbEl = document.createElement('div');
      blurbEl.className = 'card-blurb';
      blurbEl.textContent = '> ' + pick.blurb;
      card.appendChild(blurbEl);
    }

    return card;
  }

  var feed = document.getElementById('pick-feed');
  var statsFooter = document.getElementById('stats-footer');
  var currentSport = 'all';
  var loadedSportsData = {};
  var dashboardData = null;

  function clearFeed() {
    while (feed.firstChild) {
      feed.removeChild(feed.firstChild);
    }
  }

  function showMessage(text, pulse) {
    clearFeed();
    var el = document.createElement('div');
    el.className = 'feed-message';
    el.textContent = text;
    feed.appendChild(el);
  }

  function createStatusRail(mode, picks) {
    var el = document.createElement('div');
    el.className = 'status-rail';

    var label = mode === 'all' ? 'ALL SPORTS' : (mode === 'dashboard' ? 'DASHBOARD' : formatSportLabel(mode));
    var generated = '--';
    if (mode === 'dashboard') {
      generated = formatStamp((dashboardData || {}).generated_at || (dashboardData || {}).manifest_updated_at || '');
    } else if (mode === 'all') {
      var stamps = Object.keys(loadedSportsData).map(function (sport) {
        var data = loadedSportsData[sport] || {};
        return data.generated_at || data.updated_at || '';
      }).filter(Boolean);
      if (stamps.length) generated = formatStamp(stamps.sort().slice(-1)[0]);
    } else {
      var data = loadedSportsData[mode] || {};
      generated = formatStamp(data.generated_at || data.updated_at || '');
    }

    var diagnosticLines = [];
    if (mode === 'dashboard') {
      var slate = ((dashboardData || {}).aggregate || {}).slate || {};
      diagnosticLines.push(
        'slate modeled=' + (slate.modeled || 0) +
        ' | odds=' + fmtRatio(slate.with_odds, slate.fixtures) +
        ' | +ev=' + (slate.positive_ev || 0) +
        ' | eligible=' + (slate.eligible || 0) +
        ' | locks=' + (slate.locks || 0)
      );
    } else if (mode === 'all') {
      ALL_SPORTS.forEach(function (sport) {
        var sportData = loadedSportsData[sport] || {};
        var diagnostics = sportData.diagnostics || {};
        if (!diagnostics.summary) return;
        var line = formatSportLabel(sport) + ': ' + diagnostics.summary;
        if ((sportData.totals_locks || []).length) {
          line += ' | totals=' + sportData.totals_locks.length;
        }
        diagnosticLines.push(line);
      });
    } else {
      var currentData = loadedSportsData[mode] || {};
      var currentDiagnostics = currentData.diagnostics || {};
      if (currentDiagnostics.summary) {
        var currentLine = currentDiagnostics.summary;
        if ((currentData.totals_locks || []).length) {
          currentLine += ' | totals=' + currentData.totals_locks.length;
        }
        diagnosticLines.push(currentLine);
      }
    }

    el.textContent =
      '> MODE: ' + label + '\n' +
      '> PICKS LOADED: ' + (picks ? picks.length : 0) + '\n' +
      '> LAST BUILD: ' + generated +
      (diagnosticLines.length ? '\n> DIAGNOSTICS\n> ' + diagnosticLines.join('\n> ') : '');

    return el;
  }

  function renderDashboard() {
    clearFeed();
    if (!dashboardData) {
      showMessage('[ DASHBOARD UNAVAILABLE ]\n\nNo dashboard payload was found.', false);
      return;
    }

    feed.appendChild(createStatusRail('dashboard', []));

    var aggregate = dashboardData.aggregate || {};
    var record = aggregate.record || {};
    var predictions = aggregate.predictions || {};
    var slate = aggregate.slate || {};
    var leaders = dashboardData.leaders || {};
    var windows = dashboardData.windows || {};
    var actions = dashboardData.recommended_actions || [];

    feed.appendChild(createDashboardBlock('Board', [
      'RECORD      ' + fmtRecord(record),
      'HIT RATE    ' + fmtPct(record.hit_rate),
      'ROI         ' + fmtSignedPct(record.roi),
      'AVG CONF    ' + (record.avg_confidence != null ? Math.round(record.avg_confidence) + '/100' : '--'),
      'AVG EV      ' + units(record.avg_expected_value),
      'AVG CLV     ' + fmtSignedPct(record.avg_clv, 2),
      'PRED ACC    ' + fmtPct(predictions.accuracy),
      'LOG LOSS    ' + (predictions.avg_log_loss != null ? Number(predictions.avg_log_loss).toFixed(3) : '--'),
      'SLATE NOW   modeled=' + (slate.modeled || 0) + ' | odds=' + fmtRatio(slate.with_odds, slate.fixtures) + ' | +ev=' + (slate.positive_ev || 0) + ' | locks=' + (slate.locks || 0)
    ], 'AGGREGATE'));

    feed.appendChild(createDashboardBlock('Recent Windows', [
      'LAST 7D     ' + fmtRecord(windows['7d']) + ' | HIT ' + fmtPct((windows['7d'] || {}).hit_rate) + ' | ROI ' + fmtSignedPct((windows['7d'] || {}).roi),
      'LAST 30D    ' + fmtRecord(windows['30d']) + ' | HIT ' + fmtPct((windows['30d'] || {}).hit_rate) + ' | ROI ' + fmtSignedPct((windows['30d'] || {}).roi),
      '7D CLV      ' + fmtSignedPct(((windows['7d'] || {}).clv || {}).avg_clv, 2),
      '30D CLV     ' + fmtSignedPct(((windows['30d'] || {}).clv || {}).avg_clv, 2)
    ], 'RECENCY'));

    if (actions.length) {
      feed.appendChild(createDashboardBlock('Recommended Actions', actions.map(function (action, idx) {
        return createActionPrefix(action.priority) + ' ' + action.title.toUpperCase() + '\n    ' + action.detail;
      }), 'OPERATE'));
    }

    var sportLines = ['SPORT   REC        HIT      ROI      CLV      LIVE'];
    (dashboardData.sports || []).forEach(function (sport) {
      sportLines.push(
        (sport.name || '').padEnd(6, ' ').slice(0, 6) + ' ' +
        fmtRecord(sport.performance).padEnd(10, ' ').slice(0, 10) + ' ' +
        fmtPct(sport.performance.hit_rate).padEnd(8, ' ').slice(0, 8) + ' ' +
        fmtSignedPct(sport.performance.roi).padEnd(8, ' ').slice(0, 8) + ' ' +
        fmtSignedPct(sport.performance.avg_clv, 2).padEnd(8, ' ').slice(0, 8) + ' ' +
        String((sport.current.locks || 0) + 'L/' + (sport.current.totals || 0) + 'T')
      );
    });
    feed.appendChild(createDashboardBlock('Sport Splits', sportLines, 'BY SPORT'));

    var leaderLines = [];
    if (leaders.best_roi_sport) {
      leaderLines.push('BEST ROI    ' + leaders.best_roi_sport.name + ' ' + fmtSignedPct(leaders.best_roi_sport.roi));
    }
    if (leaders.best_clv_sport) {
      leaderLines.push('BEST CLV    ' + leaders.best_clv_sport.name + ' ' + fmtSignedPct(leaders.best_clv_sport.avg_clv, 2));
    }
    if (leaders.best_lane) {
      leaderLines.push('BEST LANE   ' + String(leaders.best_lane.lane).toUpperCase() + ':' + leaders.best_lane.key + ' ' + fmtSignedPct(leaders.best_lane.roi));
    }
    ((aggregate.threshold_guidance || []).slice(0, 3)).forEach(function (line, idx) {
      leaderLines.push('GUIDE ' + (idx + 1) + '    ' + line);
    });
    feed.appendChild(createDashboardBlock('Leaders + Guidance', leaderLines, 'READOUT'));

    if ((dashboardData.insights || []).length) {
      var insightLines = (dashboardData.insights || []).map(function (line, idx) {
        return (idx + 1) + '. ' + line;
      });
      feed.appendChild(createDashboardBlock('Notes', insightLines, 'INSIGHTS'));
    }
  }

  function renderFeed(picks) {
    if (!picks || picks.length === 0) {
      showMessage('[ NO PICKS POSTED ]\n\nTry another sport or check again after the next pipeline run.', false);
      return;
    }
    clearFeed();
    feed.appendChild(createStatusRail(currentSport, picks));
    picks.forEach(function (pick) {
      feed.appendChild(createPickCard(pick));
    });
  }

  function renderStats(mode) {
    if (mode === 'dashboard') {
      var record = ((dashboardData || {}).aggregate || {}).record || {};
      if (record.hit_rate == null) {
        statsFooter.textContent = 'RECORD -- | HIT RATE -- | ROI --';
      } else {
        statsFooter.textContent =
          'RECORD ' + (record.record || '--') +
          ' | HIT RATE ' + fmtPct(record.hit_rate) +
          ' | ROI ' + fmtSignedPct(record.roi);
      }
      return;
    }
    if (mode === 'all') {
      var wins = 0, losses = 0, evaluated = 0;
      Object.keys(loadedSportsData).forEach(function (sport) {
        var ps = (loadedSportsData[sport].pick_stats || {}).all || {};
        wins      += ps.wins      || 0;
        losses    += ps.losses    || 0;
        evaluated += ps.evaluated || 0;
      });
      var hitRate = evaluated > 0 ? wins / evaluated : null;
      if (hitRate === null) {
        statsFooter.textContent = 'RECORD -- | HIT RATE -- | ROI --';
      } else {
        statsFooter.textContent =
          'RECORD ' + wins + '-' + losses +
          ' | HIT RATE ' + (hitRate * 100).toFixed(1) + '%' +
          ' | ROI --';
      }
      return;
    }

    var data = loadedSportsData[mode];
    if (!data) { statsFooter.textContent = 'RECORD -- | HIT RATE -- | ROI --'; return; }
    var ps = (data.pick_stats || {}).all || {};
    var hitRate = ps.hit_rate != null ? ps.hit_rate : null;
    var roi     = ps.roi      != null ? ps.roi      : null;
    if (hitRate === null) {
      statsFooter.textContent = 'RECORD -- | HIT RATE -- | ROI --';
    } else {
      var roiStr = roi != null
        ? 'ROI ' + (roi >= 0 ? '+' : '') + (roi * 100).toFixed(1) + '%'
        : 'ROI --';
      statsFooter.textContent =
        'RECORD ' + (ps.wins || 0) + '-' + (ps.losses || 0) +
        ' | HIT RATE ' + (hitRate * 100).toFixed(1) + '%' +
        ' | ' + roiStr;
    }
  }

  var ALL_SPORTS = ['nba', 'nhl', 'ncaam', 'mlb', 'mma'];

  function loadDashboard() {
    currentSport = 'dashboard';
    showMessage('[ LOADING DASHBOARD ]', true);
    fetch('data/dashboard.json?t=' + Date.now())
      .then(function (res) {
        if (!res.ok) throw new Error(res.status);
        return res.json();
      })
      .then(function (data) {
        dashboardData = data;
        renderDashboard();
        renderStats('dashboard');
      })
      .catch(function () {
        showMessage('[ DASHBOARD ERROR ]\n\nThe reporting payload is missing or invalid.', false);
        statsFooter.textContent = 'RECORD -- | HIT RATE -- | ROI --';
      });
  }

  function loadAllSports() {
    currentSport = 'all';
    loadedSportsData = {};
    showMessage('[ LOADING ALL SPORTS ]', true);

    var fetches = ALL_SPORTS.map(function (sport) {
      return fetch('data/' + sport + '/predictions.json?t=' + Date.now())
        .then(function (res) {
          if (!res.ok) throw new Error(res.status);
          return res.json();
        })
        .then(function (data) { return { sport: sport, data: data }; });
    });

    Promise.allSettled(fetches).then(function (results) {
      var allPicks = [];

      results.forEach(function (result) {
        if (result.status !== 'fulfilled') return;
        var sport = result.value.sport;
        var data  = result.value.data;
        loadedSportsData[sport] = data;

        (data.slop_locks || []).forEach(function (pick) {
          pick.sport = sport; // tag with source sport key
          allPicks.push(pick);
        });
        (data.totals_locks || []).forEach(function (pick) {
          pick.sport = sport;
          allPicks.push(pick);
        });
      });

      if (Object.keys(loadedSportsData).length === 0) {
        showMessage('[ ERROR LOADING DATA ]\n\nThe site could not fetch any sport files.', false);
        statsFooter.textContent = 'RECORD -- | HIT RATE -- | ROI --';
        return;
      }

      allPicks.sort(function (a, b) { return b.model_prob - a.model_prob; });
      renderFeed(allPicks);
      renderStats('all');
    });
  }

  function loadSportData(sport) {
    currentSport = sport;
    showMessage('[ LOADING ' + formatSportLabel(sport) + ' ]', true);

    fetch('data/' + sport + '/predictions.json?t=' + Date.now())
      .then(function (res) {
        if (!res.ok) throw new Error(res.status);
        return res.json();
      })
      .then(function (data) {
        loadedSportsData[sport] = data;
        var locks = (data.slop_locks || []).concat(data.totals_locks || []);
        locks.forEach(function (pick) { pick.sport = sport; });
        locks.sort(function (a, b) { return b.model_prob - a.model_prob; });
        renderFeed(locks);
        renderStats(sport);
      })
      .catch(function () {
        showMessage('[ ERROR LOADING ' + formatSportLabel(sport) + ' ]\n\nThe JSON file for this sport is missing or invalid.', false);
        statsFooter.textContent = 'RECORD -- | HIT RATE -- | ROI --';
      });
  }

  document.querySelectorAll('.pill').forEach(function (pill) {
    pill.addEventListener('click', function () {
      var sport = this.getAttribute('data-sport');
      if (sport === currentSport) return;

      document.querySelectorAll('.pill').forEach(function (p) {
        p.classList.remove('active');
      });
      this.classList.add('active');

      if (sport === 'dashboard') {
        loadDashboard();
      } else if (sport === 'all') {
        loadAllSports();
      } else {
        loadSportData(sport);
      }
    });
  });

  loadAllSports();

})();
  </script>
</body>
</html>
