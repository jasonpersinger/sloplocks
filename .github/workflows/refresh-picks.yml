name: Refresh Picks

# Fast odds refresh without model retraining (~20 seconds).
# Use this anytime you want updated picks without running the full pipeline.

on:
  workflow_dispatch:  # Manual trigger only

permissions:
  contents: write

# Shares a group with daily.yml so the two never race each other on data/.
concurrency:
  group: sloplocks-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Refresh odds and recompute picks
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENABLE_QUALITATIVE: true
        run: python -m pipeline.refresh_picks

      - name: Commit and push refreshed picks
        # See daily.yml: keep healthy sports' data even if one sport errored.
        if: always()
        run: |
          set -uo pipefail
          git config user.name "sloplocks-bot"
          git config user.email "bot@sloplocks.lol"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: refresh picks $(date -u +%Y-%m-%dT%H:%MZ)"
          # Another push landing between the rebase and the push previously
          # discarded the whole run, so retry the sequence.
          # -X theirs keeps THIS run's regenerated data: during a rebase "ours"
          # is the upstream side, so the old flag preferred stale remote data.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin master && git push origin master; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed; retrying."
            sleep $((attempt * 10))
          done
          echo "::error::Could not push generated data after 5 attempts."
          exit 1

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m pipeline.notify_discord
