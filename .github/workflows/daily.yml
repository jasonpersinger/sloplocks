name: Daily Predictions

on:
  schedule:
    - cron: '0 6 * * *'  # 6am UTC daily (captures NBA games from previous night)
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run prediction pipeline
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python -m pipeline.run

      - name: Commit and push predictions
        run: |
          git config user.name "sloplocks-bot"
          git config user.email "bot@sloplocks.lol"
          git add data/
          git diff --staged --quiet || git commit -m "data: daily predictions $(date -u +%Y-%m-%d)"
          git pull --rebase origin master
          git push
