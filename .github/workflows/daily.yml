name: Daily Predictions

on:
  schedule:
    - cron: '0 6 * * *'  # 6am UTC daily (captures NBA games from previous night)
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run prediction pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pipeline.run

      - name: Commit and push predictions
        run: |
          git config user.name "sloplocks-bot"
          git config user.email "bot@sloplocks.lol"
          git add data/
          git diff --staged --quiet || git commit -m "data: daily predictions $(date -u +%Y-%m-%d)"
          # Use rebase with ours strategy for data files to prioritize fresh predictions
          git pull --rebase origin master -X ours
          git push origin master

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m pipeline.notify_discord

